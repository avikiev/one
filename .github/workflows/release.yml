name: Release build

# Runs only when you push a tag like v0.2.0, or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check that release secrets exist
        env:
          KS: ${{ secrets.BW_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret BW_RELEASE_KEYSTORE_BASE64 is missing. See RELEASING.md."
            exit 1
          fi
      - name: Restore keystore
        run: echo "${{ secrets.BW_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test, build signed APK and AAB
        env:
          BW_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          BW_RELEASE_STORE_PASSWORD: ${{ secrets.BW_RELEASE_STORE_PASSWORD }}
          BW_RELEASE_KEY_ALIAS: ${{ secrets.BW_RELEASE_KEY_ALIAS }}
          BW_RELEASE_KEY_PASSWORD: ${{ secrets.BW_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease bundleRelease
      - name: Print signing certificate (compare with RELEASING.md)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep SHA-256
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: KyivBallisticWatch-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
