plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.kyiv.ballisticwatch'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.kyiv.ballisticwatch'
        minSdk 26
        targetSdk 35
        // Keep in sync with scripts/build-apk.sh
        versionCode 2
        versionName '0.1.1'
    }

    // Release key comes only from the environment (GitHub Secrets or your shell),
    // never from the repository. See RELEASING.md.
    def releaseKeystore = System.getenv('BW_RELEASE_KEYSTORE')

    signingConfigs {
        // Public debug key: lets debug builds from Android Studio, CI and
        // scripts/build-apk.sh update each other. NEVER use it for releases.
        shared {
            storeFile rootProject.file('keystore/debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('BW_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('BW_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('BW_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            // Without the secrets the release build stays unsigned on purpose.
            if (releaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
