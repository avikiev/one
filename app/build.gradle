plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.kyiv.ballisticwatch'
    compileSdk 35

    defaultConfig {
        applicationId 'ua.kyiv.ballisticwatch'
        minSdk 26
        targetSdk 35
        // Keep in sync with scripts/build-apk.sh
        versionCode 2
        versionName '0.1.1'
    }

    signingConfigs {
        // Shared debug key so APKs from Android Studio, CI and scripts/build-apk.sh
        // can update each other. Not a secret: never use it for a store release.
        shared {
            storeFile rootProject.file('keystore/debug.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
